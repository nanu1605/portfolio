name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # nightly, 02:30 IST

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The full matrix runs 28–38 min of e2e, then about 15 min of
    # Lighthouse. Browser installs have taken 20 min on a slow night.
    timeout-minutes: 90
    env:
      # PRs run the default device projects; main and nightly run the full
      # matrix from docs/cross-device.md §8.
      FULL_MATRIX: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:tokens
      - run: pnpm check:content
      - run: pnpm build

      - name: Install browsers
        run: |
          if [ "$FULL_MATRIX" = "true" ]; then
            pnpm exec playwright install --with-deps chromium webkit firefox
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi
      - name: End-to-end tests
        run: |
          if [ "$FULL_MATRIX" = "true" ]; then
            pnpm test:e2e --project="desktop-*" --project="phone-*" --project="tablet-*" --project="perf-*"
          else
            pnpm test:e2e
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Interaction long-task budgets at 4x CPU throttle (§19 Phase 5),
      # alone and one at a time, so other tests can't steal the CPU.
      - name: Interaction budgets
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-budget
        run: pnpm test:budget
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: playwright-report-budget
          path: playwright-report-budget
          retention-days: 7

      # §13 budgets on Home with applied (devtools) throttling; see
      # docs/decisions.md for why not simulated. Mobile always, desktop on
      # main and nightly.
      - name: Lighthouse (mobile)
        run: pnpm exec lhci autorun --upload.outputDir=lighthouse-report/mobile
      - name: Lighthouse (desktop)
        if: ${{ env.FULL_MATRIX == 'true' }}
        run: pnpm exec lhci autorun --collect.settings.preset=desktop --upload.outputDir=lighthouse-report/desktop
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: lighthouse
          path: lighthouse-report
          retention-days: 7
