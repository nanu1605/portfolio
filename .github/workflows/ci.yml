name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # nightly, 02:30 IST

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PRs run the default device projects; main and nightly run the full
      # matrix from docs/cross-device.md §8.
      FULL_MATRIX: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:tokens
      - run: pnpm check:content
      - run: pnpm build

      - name: Install browsers
        run: |
          if [ "$FULL_MATRIX" = "true" ]; then
            pnpm exec playwright install --with-deps chromium webkit firefox
          else
            pnpm exec playwright install --with-deps chromium webkit
          fi
      - name: End-to-end tests
        run: |
          if [ "$FULL_MATRIX" = "true" ]; then
            pnpm test:e2e --project="desktop-*" --project="phone-*" --project="tablet-*"
          else
            pnpm test:e2e
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - run: pnpm audit --prod --audit-level high
